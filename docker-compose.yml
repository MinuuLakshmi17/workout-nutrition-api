services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/workout_api
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: dev-only-change-me
      CORS_ORIGINS: http://localhost:8000
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
  worker:
    build: .
    command: celery -A app.tasks.celery_app.celery worker --loglevel=INFO
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/workout_api
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: dev-only-change-me
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
  beat:
    build: .
    command: celery -A app.tasks.celery_app.celery beat --loglevel=INFO
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/workout_api
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: dev-only-change-me
    depends_on:
      redis: {condition: service_healthy}
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: workout_api
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres -d workout_api"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
